<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up & Sign In</title>
    <link rel="stylesheet" href="/style of home & signup&signin/signup&in.css">
</head>
<body>

    <div class="container">
    <img class="logo" src="/assets/picutres/logo2_footer.png" alt="logo"><br>
    <h3>REGISTRATION HERE</h3>
    <label for="name">FULL NAME</label><br>
    <input type="text" id="name" name="name" placeholder="Enter your full name">
    <br><br>
    <label for="email">EMAIL</label><br>
    <input type="email" id="email" name="email" placeholder="Enter your email">
    <br><br>
    <label for="password">PASSWORD</label><br>
    <input type="password" id="password" name="password" placeholder="Enter your password">
    <br><br>
    <label for="password">CONFIRM PASSWORD</label><br>
    <input type="password" id="confirmpassword" name="confirmpassword" placeholder="Re-enter your password">
    <br><br>
    <button type="submit">SIGN UP</button><br>
    <a href="/Sign Up&In/signup&in.html">Already have an account? Sign In</a>
</div>
<div class="back-btn">
   <a href="/Index.html">Back</a>
</div>
</body>
</html>
